<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral conceitual do estúdio MdEditor</title>
  <desc id="desc">Ilustração da interface escura do MdEditor com escolha de fluxo, progresso por etapas, painel de preview e brief.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111411"/><stop offset="1" stop-color="#20251d"/></linearGradient><linearGradient id="scene" x2="0" y2="1"><stop stop-color="#798878"/><stop offset=".55" stop-color="#29352d"/><stop offset="1" stop-color="#101512"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#cbd978"/><stop offset="1" stop-color="#e4e7ae"/></linearGradient></defs>
  <rect width="1440" height="800" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="798" rx="27" fill="none" stroke="#4b5443"/>
  <rect x="1" y="1" width="1438" height="78" rx="27" fill="#181c17"/><path d="M1 78h1438" stroke="#333a30"/>
  <rect x="34" y="19" width="40" height="40" rx="12" fill="#171b16" stroke="#cbd978" stroke-width="1.5"/><path d="M44 49V29h5l5 7 5-7h5v20h-5V37l-5 8-5-8v12z" fill="#eef0e6"/><text x="88" y="44" fill="#eef0e6" font-family="Arial,sans-serif" font-size="17" font-weight="700">MD<tspan fill="#cbd978">EDITOR</tspan></text><text x="88" y="59" fill="#929b8b" font-family="Arial,sans-serif" font-size="8" letter-spacing="2">ESTÚDIO DE VÍDEO</text>
  <text x="58" y="127" fill="#cbd978" font-family="Arial,sans-serif" font-size="10" letter-spacing="2.5">ESTÚDIO DE EDIÇÃO · MDEDITOR</text><text x="58" y="183" fill="#eef0e6" font-family="Georgia,serif" font-size="41">Qual vídeo vamos</text><text x="58" y="230" fill="#cbd978" font-family="Georgia,serif" font-size="41" font-style="italic">fazer hoje?</text><text x="60" y="262" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="13">Escolha o fluxo. Configure em etapas. Revise antes de exportar.</text>
  <g font-family="Arial,sans-serif"><rect x="58" y="300" width="305" height="122" rx="12" fill="#20251d" stroke="#cbd978"/><text x="78" y="328" fill="#cbd978" font-size="9" letter-spacing="1.4">01 / VÍDEO GRAVADO</text><text x="78" y="361" fill="#eef0e6" font-size="17" font-weight="700">Editar meus vídeos</text><text x="78" y="385" fill="#aeb7a8" font-size="11">Vlog · viagem · jogo · entrevista</text><text x="78" y="405" fill="#aeb7a8" font-size="10">A história começa no seu material bruto.</text>
  <rect x="378" y="300" width="305" height="122" rx="12" fill="#1a1e19" stroke="#41483d"/><text x="398" y="328" fill="#aeb7a8" font-size="9" letter-spacing="1.4">02 / CRIAR DO ZERO</text><text x="398" y="361" fill="#eef0e6" font-size="17" font-weight="700">Criar motion</text><text x="398" y="385" fill="#aeb7a8" font-size="11">Animação · marca · explicativo</text><text x="398" y="405" fill="#aeb7a8" font-size="10">Roteiro, storyboard e movimento.</text>
  <rect x="698" y="300" width="305" height="122" rx="12" fill="#1a1e19" stroke="#41483d"/><text x="718" y="328" fill="#aeb7a8" font-size="9" letter-spacing="1.4">03 / VÍDEO CURTO</text><text x="718" y="361" fill="#eef0e6" font-size="17" font-weight="700">Adaptar para Reel</text><text x="718" y="385" fill="#aeb7a8" font-size="11">Reels · Shorts · TikTok</text><text x="718" y="405" fill="#aeb7a8" font-size="10">Recorte com contexto e formato social.</text></g>
  <rect x="58" y="453" width="945" height="290" rx="12" fill="#1b201a" stroke="#394134"/><text x="84" y="488" fill="#cbd978" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">ETAPA 02 DE 06</text><text x="84" y="530" fill="#eef0e6" font-family="Georgia,serif" font-size="25">Qual sensação deve guiar a montagem?</text><text x="84" y="556" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="11">Escolha a linguagem que combina com o material e com a história.</text>
  <rect x="84" y="586" width="272" height="90" rx="10" fill="#23291f" stroke="#cbd978"/><text x="104" y="617" fill="#eef0e6" font-family="Arial,sans-serif" font-size="14" font-weight="700">Cinema documental</text><text x="104" y="642" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="10">Natural · imersivo · observacional</text><path d="m324 605 8 8-8 8" fill="none" stroke="#cbd978" stroke-width="2"/>
  <rect x="372" y="586" width="272" height="90" rx="10" fill="#20251d" stroke="#41483d"/><text x="392" y="617" fill="#eef0e6" font-family="Arial,sans-serif" font-size="14" font-weight="700">Energético</text><text x="392" y="642" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="10">Ritmo alto · cortes motivados</text>
  <rect x="660" y="586" width="310" height="90" rx="10" fill="#20251d" stroke="#41483d"/><text x="680" y="617" fill="#eef0e6" font-family="Arial,sans-serif" font-size="14" font-weight="700">A decidir depois</text><text x="680" y="642" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="10">A IA recomenda após analisar o material.</text>
  <rect x="84" y="704" width="105" height="25" rx="7" fill="#252b23"/><text x="108" y="721" fill="#d7decf" font-family="Arial,sans-serif" font-size="10">← Voltar</text><rect x="851" y="704" width="119" height="25" rx="7" fill="url(#accent)"/><text x="871" y="721" fill="#171b16" font-family="Arial,sans-serif" font-size="10" font-weight="700">Continuar →</text>
  <rect x="1030" y="112" width="352" height="631" rx="12" fill="#1a1e19" stroke="#394134"/><text x="1054" y="146" fill="#cbd978" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">PRÉVIA DE DIREÇÃO</text><text x="1054" y="174" fill="#eef0e6" font-family="Georgia,serif" font-size="19">Vlog cinematográfico</text><rect x="1054" y="194" width="304" height="208" rx="10" fill="url(#scene)"/><path d="M1054 343q50-43 100 0t102-5 102 6v58h-304z" fill="#1a211b"/><path d="M1054 369q52-31 102 0t101-2 101 2v33h-304z" fill="#111611"/><circle cx="1102" cy="280" r="4" fill="#e6e1bb"/><circle cx="1143" cy="269" r="4" fill="#e6e1bb"/><circle cx="1190" cy="280" r="4" fill="#e6e1bb"/><circle cx="1240" cy="266" r="4" fill="#e6e1bb"/><circle cx="1300" cy="278" r="4" fill="#e6e1bb"/><text x="1074" y="340" fill="#d6d9c3" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.6">ATLÉTICO · DIA DE JOGO</text><text x="1074" y="369" fill="#fffdf0" font-family="Georgia,serif" font-size="18">Uma história vivida</text><text x="1074" y="390" fill="#fffdf0" font-family="Georgia,serif" font-size="18">de perto.</text>
  <text x="1054" y="430" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="10">Amostra ilustrativa; a edição usa seus arquivos.</text><rect x="1054" y="452" width="304" height="1" fill="#394134"/><text x="1054" y="482" fill="#cbd978" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.6">SEU BRIEF ATÉ AGORA</text>
  <g fill="#d9dfd0" font-family="Arial,sans-serif" font-size="11"><circle cx="1061" cy="510" r="3" fill="#cbd978"/><text x="1074" y="514">Fluxo: vídeo gravado</text><circle cx="1061" cy="541" r="3" fill="#cbd978"/><text x="1074" y="545">Estilo: cinema documental</text><circle cx="1061" cy="572" r="3" fill="#cbd978"/><text x="1074" y="576">Formato: 16:9</text><circle cx="1061" cy="603" r="3" fill="#cbd978"/><text x="1074" y="607">Motion: desligado</text></g><rect x="1054" y="641" width="304" height="76" rx="9" fill="#242a21" stroke="#41483d"/><text x="1070" y="666" fill="#eef0e6" font-family="Arial,sans-serif" font-size="10" font-weight="700">🔒 Seus arquivos ficam no dispositivo</text><text x="1070" y="686" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="9">Anexe o original também à conversa com a IA.</text><text x="1070" y="701" fill="#aeb7a8" font-family="Arial,sans-serif" font-size="9">O site não faz upload nem renderização.</text>
</svg>
